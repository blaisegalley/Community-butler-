# Harvey's configuration. Who Harvey writes as, what it sells, who it writes to,
# and the limits it works under. Plain text: edit it and the next run behaves
# differently. See harvey/README.md for how the pieces fit together.
#
# This repo is public. Keep prospect names, emails and notes OUT of this file;
# they live on the private Harvey Desk page (desk.url below).

persona:
  name: "Blaise Galley"
  company: "Community Butler"
  role: "Chief Expansion Officer"
  email: "thecommunitybutler@gmail.com"
  linkedin: ""
  tone: "friendly, casual, human, local. A high school student from the neighborhood, not a corporate sales rep. Short and specific, no buzzwords."

product:
  name: "Community Butler"
  description: >-
    Community Butler is a student-run company from the Barrington High School
    incubator program. Trained local high school students ("Butlers") do the
    everyday jobs people don't have time for, listed on our website:
    yard work (weeding, mowing, raking), snow shoveling, moving help (loading
    and carrying furniture), power washing, junk hauling, dog walking and odd
    jobs. Neighbors post a job in about two minutes. We are now
    also building websites for small local businesses; our Butlers build them with
    AI, so they come together fast and cost far less than an agency. Two audiences
    right now: (1) real estate agents, who can use Butlers for listing prep, move-in
    and move-out help, cleanups and snow and lawn care on vacant listings, and
    (2) small local businesses with no website or an outdated one.
  pricing: "Websites: $700 to $1,250 depending on the size of the site. Butler jobs: quoted per job."
  key_benefits:
    - "Real estate agents: reliable local help for listing prep, cleanouts, moving, power washing, yard cleanup and snow, from students who live nearby and show up"
    - "Small businesses: a real website for $700 to $1,250, a fraction of what agencies charge"
    - "Websites are built by Butlers with AI, so turnaround is fast"
    - "Local and personal: one point of contact from your own area, not a call center"
    - "Every dollar supports local students learning to run real work"
  objection_responses:
    "too expensive (website)": "Totally fair. The website price range is $700 to $1,250 and depends on how big the site is, so I can tell you what the simplest version looks like. Want me to send a quick outline of what you'd get?"
    "too expensive (Butler job)": "Fair enough. Butler jobs are priced per job, so tell me what you'd want done and we'll work out a number that makes sense before anyone shows up."
    "we already have a website": "Makes sense. Is it one you're happy with? A lot of the local sites we see are a few years old and hard to use on a phone. Happy to take a quick look and tell you honestly if it's worth changing."
    "we already have someone for that": "Good, that's the best problem to have. If they're ever booked up, or you have an overflow job, keep us in mind. Mind if I leave you my number?"
    "you're just students": "We are, and we are upfront about it. Our Butlers are trained and local, and I'm the point of contact on every job. Start small with one job and judge us on that."
    "not interested": "No worries at all, thanks for letting me know. If anything changes, you can reach us at thecommunitybutler@gmail.com."
  offer:
    primary: "Our regular Butler services (yard work, raking, snow shoveling, moving help, power washing, junk hauling, dog walking and odd jobs), pitched to real estate agents, and websites for small businesses at $700 to $1,250."
    entry: ""                      # Add a low-commitment hook here if you want one (e.g. a free site mockup or a first-job discount) once you've decided you can honor it
    goal: "get_reply"              # Realtors and shop owners are more likely to answer a short email than book a call
    booking_method: "ask_preference"
    booking_url: ""
    meeting_duration: "10 minutes"
    meeting_owner: "Blaise Galley"

icp:
  industries:
    - "Real Estate Agent"
    - "Real Estate Brokerage"
    - "Small Local Business (restaurant, salon, boutique, contractor, landscaper, auto shop, fitness studio, etc.)"
  company_size: "1-20 employees"
  titles:
    - "Real Estate Agent"
    - "Realtor"
    - "Broker"
    - "Managing Broker"
    - "Team Lead"
    - "Owner"
    - "Founder"
    - "Co-Owner"
  geography:
    - "Barrington, IL"
    - "Arlington Heights, IL"
    - "Palatine, IL"
    - "Chicago northwest suburbs, IL"
  hiring_signals: []

channels:
  email:
    enabled: true
    provider: "gmail"          # Harvey never sends. You send from Gmail using the Desk's "Open in Gmail" button.
    max_daily_sends: 20         # low while the sending mailbox is new; raise later
    require_approval: true      # every email waits in the Desk outbox for you. Harvey cannot turn this off.
    send_to_risky: false        # only email addresses Harvey found published by the business itself
    max_bounce_rate: 0.05       # if more than 5% of sent emails bounce, Harvey stops writing new first emails
    gmail_drafts_mailbox: "thecommunitybutler@gmail.com"  # Harvey only writes Gmail drafts when the Gmail connected to Claude is this account
  linkedin:
    enabled: false
    max_daily_connections: 20
    max_daily_messages: 10

usage:
  max_daily_claude_percent: 80
  heartbeat_interval_minutes: 15   # used by the original Harvey only; this Harvey runs when you start it or on a schedule
  max_new_prospects_per_run: 10    # keep batches small; each one gets real research
  quiet_hours:                     # the Desk won't let you send during these hours
    start: "21:00"
    end: "08:00"
    timezone: "America/Chicago"

compliance:
  # US law (CAN-SPAM) requires a real postal address in every sales email.
  # A P.O. box works. Set it on the Desk (Settings); the Desk blocks sending until it is set.
  mailing_address_set_on_desk: true
  sequence_follow_up_days: [4, 7]  # email 2 goes 4 days after email 1, email 3 goes 7 days after email 2, then stop

desk:
  # The private claude.ai page that holds the pipeline, outbox and opt-outs.
  # Only people you share it with can open it.
  url: "https://claude.ai/artifact/KmGNFz1CPHTcMG3Wqq12h7"
