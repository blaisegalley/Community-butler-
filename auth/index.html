<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Started / Butler Sign In — Community Butler</title>
<meta name="description" content="Sign up as a Butler or sign in to see your jobs, schedule, and pay.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 44'%3E%3Cpolygon points='5,5 21,10 5,15' fill='%230A0908'/%3E%3Cpolygon points='43,5 27,10 43,15' fill='%230A0908'/%3E%3Crect x='20.5' y='7' width='7' height='6' rx='1.2' fill='%230A0908'/%3E%3Cpath d='M4,41 L4,21 Q4,16 9,16 L18,16 L24,27 L30,16 L39,16 Q44,16 44,21 L44,41 Z' fill='%230A0908'/%3E%3Ccircle cx='24' cy='31' r='1.7' fill='white'/%3E%3Ccircle cx='24' cy='35' r='1.7' fill='white'/%3E%3Ccircle cx='24' cy='39' r='1.7' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&family=Instrument+Serif:ital@1&display=swap">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body style="background:#FAF9F6;color:#0A0908">

<div class="grain" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"></div>

<div class="page">
  <div class="menu-backdrop" id="menu-backdrop" aria-hidden="true"></div>

  <header class="header">
    <a href="/" class="logo" aria-label="Community Butler">
      <svg class="mark" viewBox="0 0 48 44" aria-hidden="true">
        <polygon points="5,5 21,10 5,15" fill="#0A0908"/>
        <polygon points="43,5 27,10 43,15" fill="#0A0908"/>
        <rect x="20.5" y="7" width="7" height="6" rx="1.2" fill="#0A0908"/>
        <path d="M4,41 L4,21 Q4,16 9,16 L18,16 L24,27 L30,16 L39,16 Q44,16 44,21 L44,41 Z" fill="#0A0908"/>
        <circle cx="24" cy="31" r="1.7" fill="#FAF9F6"/>
        <circle cx="24" cy="35" r="1.7" fill="#FAF9F6"/>
        <circle cx="24" cy="39" r="1.7" fill="#FAF9F6"/>
      </svg>
      <span>Community<span class="logo-suffix"> Butler</span></span>
    </a>

    <nav id="site-nav" class="nav" aria-label="Primary">
      <a href="/#butlers" class="nav-link">For Butlers</a>
      <a href="/#neighbors" class="nav-link">For Neighbors</a>
      <a href="/request/" class="nav-link">Request a Job</a>
    </nav>

    <div class="header-right">
      <button type="button" class="burger" id="burger" aria-controls="site-nav" aria-expanded="false" aria-label="Open menu">
        <span class="burger-bar"></span><span class="burger-bar"></span><span class="burger-bar"></span>
      </button>
    </div>
  </header>

  <main id="top">
    <div id="auth-guest">
      <section class="hero hero-compact">
        <div class="hero-bg" aria-hidden="true"></div>
        <div class="hero-copy">
          <div class="auth-toggle">
            <button type="button" data-mode="signup">Sign up</button>
            <button type="button" data-mode="signin">Sign in</button>
          </div>

          <h1 id="auth-heading" style="font-size:var(--h2); font-weight:600;">Get started</h1>
          <p id="auth-lede" class="lede">Create your Butler account to start seeing jobs near you.</p>
        </div>
      </section>

      <section class="section" style="padding-top:0;">
        <div class="form-shell reveal">
          <div id="auth-error" class="form-error"></div>
          <form data-auth-form novalidate>
            <div class="auth-only" data-mode="signup">
              <div class="field">
                <label for="su-name">Name</label>
                <input id="su-name" name="name" type="text" autocomplete="name" required>
              </div>
              <div class="field">
                <label for="su-contact">Phone or email</label>
                <input id="su-contact" name="contact" type="text" autocomplete="tel" required>
              </div>
              <div class="field">
                <label for="su-area">Service area</label>
                <input id="su-area" name="area" type="text" placeholder="Zip code or neighborhood" required>
              </div>
              <div class="field">
                <label>Job types you're interested in</label>
                <div style="display:flex; flex-wrap:wrap; gap:8px 16px; padding-top:2px;">
                  <label style="display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--charcoal-soft); font-weight:400;"><input type="checkbox" name="jobTypePref" value="Yard work"> Yard work</label>
                  <label style="display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--charcoal-soft); font-weight:400;"><input type="checkbox" name="jobTypePref" value="Snow shoveling"> Snow shoveling</label>
                  <label style="display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--charcoal-soft); font-weight:400;"><input type="checkbox" name="jobTypePref" value="Moving help"> Moving help</label>
                  <label style="display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--charcoal-soft); font-weight:400;"><input type="checkbox" name="jobTypePref" value="Junk hauling"> Junk hauling</label>
                  <label style="display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--charcoal-soft); font-weight:400;"><input type="checkbox" name="jobTypePref" value="Cleanouts"> Cleanouts</label>
                  <label style="display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--charcoal-soft); font-weight:400;"><input type="checkbox" name="jobTypePref" value="Dog walking"> Dog walking</label>
                  <label style="display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--charcoal-soft); font-weight:400;"><input type="checkbox" name="jobTypePref" value="Odd jobs"> Odd jobs</label>
                </div>
              </div>
              <div class="field">
                <label for="su-password">Password</label>
                <input id="su-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
              </div>
            </div>

            <div class="auth-only" data-mode="signin">
              <div class="field">
                <label for="si-contact">Phone or email</label>
                <input id="si-contact" name="contact" type="text" autocomplete="username" required>
              </div>
              <div class="field">
                <label for="si-password">Password</label>
                <input id="si-password" name="password" type="password" autocomplete="current-password" required>
              </div>
            </div>

            <button type="submit" id="auth-submit" class="btn btn-solid btn-wide hero-btn">Create account</button>
          </form>
        </div>
      </section>
    </div>

    <div id="auth-dashboard" hidden>
      <section class="section">
        <div class="butler-dash">
          <div class="butler-dash-head">
            <div>
              <h2 id="dash-greeting">Welcome back</h2>
              <p class="butler-dash-sub" id="dash-sub"></p>
            </div>
            <button type="button" id="butler-logout" class="btn btn-ghost" style="height:38px; padding:0 16px; font-size:13px;">Log out</button>
          </div>

          <div class="dash-section">
            <h3>Available jobs <span id="available-count" style="font-weight:400; color:var(--muted); font-size:12.5px;"></span></h3>
            <div id="available-list"></div>
          </div>

          <div class="dash-section">
            <h3>My jobs</h3>
            <div id="my-jobs-list"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <svg class="mark" viewBox="0 0 48 44" aria-hidden="true">
          <polygon points="5,5 21,10 5,15" fill="#E8B33D"/>
          <polygon points="43,5 27,10 43,15" fill="#E8B33D"/>
          <rect x="20.5" y="7" width="7" height="6" rx="1.2" fill="#E8B33D"/>
          <path d="M4,41 L4,21 Q4,16 9,16 L18,16 L24,27 L30,16 L39,16 Q44,16 44,21 L44,41 Z" fill="#E8B33D"/>
          <circle cx="24" cy="31" r="1.7" fill="#0A0908"/>
          <circle cx="24" cy="35" r="1.7" fill="#0A0908"/>
          <circle cx="24" cy="39" r="1.7" fill="#0A0908"/>
        </svg>
        Community Butler
      </div>
      <div class="footer-links">
        <a href="mailto:thecommunitybutler@gmail.com">thecommunitybutler@gmail.com</a>
        <a href="tel:+12246339328">(224) 633-9328</a>
        <a href="https://groupme.com/join_group/116716938/yCXfMLwo" target="_blank" rel="noopener">Join the Butler GroupMe</a>
      </div>
      <p class="footer-copy">© <span id="year"></span> Community Butler. All rights reserved.</p>
    </div>
  </footer>
</div>

<script src="/assets/store.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/butler.js"></script>
</body>
</html>
